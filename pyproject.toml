[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-career-intelligence"
version = "0.1.0"
description = "Evidence-first personal career intelligence for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
career-intelligence-demo = "hermes_career_intelligence.demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

